0,170,440,420],paradeWide:[0,-18,430,210],paradeHigh:[0,-5,580,320],nightSky:[0,110,640,560],marchPass:[0,-20,580,320],cityNight:[0,0,3300,3100],overviewNight:[0,150,660,580],airWatch:[0,-10,720,420],unit:[0,-18,170,100]},Cc={dawn:{bg:"#4a4046",pave:"#a99b8e",sky:"#e79d78",night:.15},morning:{bg:"#5f5a52",pave:"#bdb3a2",sky:"#cfdced",night:0},noon:{bg:"#625c53",pave:"#c3b9a8",sky:"#d8e6f2",night:0},afternoon:{bg:"#5e554a",pave:"#c1b39b",sky:"#f0d9b4",night:0},lateAfternoon:{bg:"#54483d",pave:"#b5a184",sky:"#f3b979",night:.05},dusk:{bg:"#2e2630",pave:"#6f6164",sky:"#d9643a",night:.7},night:{bg:"#0b0a14",pave:"#2c2833",sky:"#1b1733",night:1}},Ux={navy:"#2d4fa8",infantry:"#7a784c",artillery:"#556238",tanks:"#4a5431",cavalry:"#8a3a1c"},Dx={navy:"海军",infantry:"步兵",artillery:"炮兵",tanks:"战车",cavalry:"骑兵"},wd=i=>{let e=parseInt(i.slice(1),16);return[e>>16&255,e>>8&255,e&255]},Nx=(i,e,t)=>{let n=wd(i),s=wd(e);return"rgb(".concat(Math.round(Hn(n[0],s[0],t)),",").concat(Math.round(Hn(n[1],s[1],t)),",").concat(Math.round(Hn(n[2],s[2],t)),")")}});var Fo=["1949年10月1日，中华人民共和国中央人民政府成立，在首都北京举行典礼。参加开国大典的，有中华人民共和国中央人民政府主席、副主席、各位委员，有中国人民政治协商会议全体代表，有工人、农民、学校师生、机关工作人员、城防部队，总数达三十万人。观礼台上还有外宾。","会场在天安门广场。广场呈丁字形。丁字形一横的北面是一道河，河上并排架着五座白石桥；再北面是城墙，城墙中央高高耸起天安门的城楼。丁字形的一竖向南直伸到中华门。在一横一竖的交点的南面，场中挺立着一根电动旗杆。","主席台设在天安门城楼上。城楼檐下，八盏大红宫灯分挂两边。靠着城楼左右两边的石栏，八面红旗迎风招展。","丁字形的广场汇集了从四面八方来的群众队伍。早上六点钟起，就有群众的队伍入场了。人们有的擎着红旗，有的提着红灯。进入会场后，按照预定的地点排列。工人队伍中，有从老远的长辛店、丰台、通县来的铁路工人，他们清早到了北京车站，一下火车就直奔会场。郊区的农民是五更天摸着黑起床，步行四五十里路赶来的。到了正午，天安门广场已经成了人的海洋，红旗翻动，像海上的波浪。","下午三点整，会场上爆发出一阵排山倒海的掌声，中华人民共和国中央人民政府主席毛泽东出现在主席台上，跟群众见面了。三十万人的目光一齐投向主席台。","中央人民政府秘书长林伯渠宣布典礼开始。中央人民政府主席、副主席、各位委员就位。乐队奏起了中华人民共和国国歌——《义勇军进行曲》。正是这战斗的声音，曾经鼓舞中国人民为新中国的诞生而奋斗。接着，毛泽东主席宣布：“中华人民共和国中央人民政府今天成立了！”","这庄严的宣告，这雄伟的声音，使全场三十万人一齐欢呼起来。这庄严的宣告，这雄伟的声音，经过无线电的广播，传到长城内外，传到大江南北，使全中国人民的心一齐欢跃起来。","接着，升国旗。毛主席亲自按动连通电动旗杆的电钮，新中国的国旗——五星红旗徐徐上升。三十万人一齐脱帽肃立，一齐抬起头，瞻仰这鲜红的国旗。五星红旗升起来了，表明中国人民从此站起来了。","升旗的时候，礼炮响起来。每一响都是五十四门大炮齐发，一共二十八响。起初是全场肃静，只听见炮声，只听见国旗和许多旗帜飘拂的声音，到后来，每声炮响后，全场就响起一阵雷鸣般的掌声。","接着，毛主席在群众一阵又一阵的掌声中宣读中央人民政府的公告。他用强有力的语调向全世界发出新中国的声音。他读到“选举了毛泽东为中央人民政府主席”这一句的时候，广场上的人们热爱领袖的心情融成一阵热烈的欢呼。观礼台上同时响起一阵掌声。","毛主席宣读公告完毕，阅兵式开始。中国人民解放军朱德总司令任检阅司令员，聂荣臻将军任阅兵总指挥。朱总司令和聂将军同乘汽车，先检阅部队，然后朱总司令回到主席台，宣读中国人民解放军总部的命令。受检阅的部队就由聂将军率领，在《中国人民解放军进行曲》的乐曲声中，由东往西，缓缓进场。","开头是海军两个排，雪白的帽子，跟海洋一个颜色的蓝制服。接着是步兵一个师，以连为单位，列成方阵，齐步行进。接着是炮兵一个师，野炮、山炮、榴弹炮、火箭炮，各式各样的炮，都排成一字形的横列前进。接着是一个战车师，各种装甲车和坦克车两辆或三辆一排，整整齐齐地前进；战士们挺着胸膛站在战车上，像钢铁巨人一样。接着是一个骑兵师，“红马连”一色红马，“白马连”一色白马，五马并行，马腿的动作完全一致。以上这些部队，全都以相等的距离和相同的速度经过主席台前。当战车部队经过的时候，人民空军的飞机也一队队排成人字形，飞过天空。毛主席首先向空中招手。群众看见了，都把头上的帽子、手里的报纸和别的东西抛上天去，欢呼声盖过了飞机的隆隆声。","两个半钟头的检阅，广场上不断地欢呼，不断地鼓掌，一个高潮接着一个高潮。群众差不多把嗓子都喊哑了，把手掌都拍麻了，还觉得不能够表达自己心里的欢喜和激动。","阅兵式完毕，已经是傍晚的时候。天安门广场上的灯笼火把全都点起来，一万支礼花陆续射入天空。天上五颜六色的火花结成彩，地上千千万万的灯火一片红。群众游行就在这时候开始，游行队伍分东西两个方向出发，他们擎着灯，舞着火把，高呼“中国共产党万岁！”“中华人民共和国万岁！”“中央人民政府万岁！”他们一队一队按照次序走，走过正对天安门的白石桥前，就举起灯笼火把，高声欢呼“毛主席万岁！”“毛主席万岁！”毛主席在城楼上主席台前边，向前探着身子，不断地向群众挥手，不断地高呼“人民万岁！”“同志们万岁！”","晚上九点半，游行队伍才完全走出会场。两股“红流”分头向东城、西城的街道流去，光明充满了整个北京城。"],lh=[{name:"群众入场",paras:[1,2,3,4],color:"#e7b24f"},{name:"开国典礼",paras:[5,6,7,8,9,10],color:"#e0412f"},{name:"阅兵式",paras:[11,12,13],color:"#6fa3c8"},{name:"群众游行",paras:[14,15],color:"#f08a3c"}],ta=[{id:"prologue",no:"序",name:"这一天",en:"OCT 1 1949"},{id:"venue",no:"一",name:"会场",en:"THE SQUARE"},{id:"entry",no:"二",name:"入场",en:"THE CROWD"},{id:"ceremony",no:"三",name:"典礼",en:"THE CEREMONY"},{id:"parade",no:"四",name:"阅兵",en:"THE PARADE"},{id:"march",no:"五",name:"游行",en:"THE NIGHT"},{id:"exam",no:"六",name:"通关",en:"EXAM KIT"}],ch=[["擎着","擎",["qíng"]],["直奔","奔",["bèn"]],["五更天","更",["gēng"]],["瞻仰","瞻仰",["zhān","yǎng"]],["肃立","肃",["sù"]],["聂荣臻","聂荣臻",["niè","róng","zhēn"]],["榴弹炮","榴",["liú"]],["飘拂","拂",["fú"]],["秘书长","长",["zhǎng"]],["长辛店","长",["cháng"]],["语调","调",["diào"]],["八盏","盏",["zhǎn"]],["旗帜","帜",["zhì"]],["陆续","陆续",["lù","xù"]],["胸膛","膛",["táng"]],["曾经","曾",["céng"]]],cn=[{id:"p1",act:"prologue",clock:"这一天",para:1,focus:["1949年10月1日","在首都北京举行典礼","有中华人民共和国中央人民政府主席、副主席、各位委员","有中国人民政治协商会议全体代表","有工人、农民、学校师生、机关工作人员、城防部队","总数达三十万人","观礼台上还有外宾"],title:"开篇：时间、地点、人物，一句不落",stage:{cam:"dawnWide",tod:"dawn",reveal:"none",crowd:0},interact:"counter",points:[{tag:"开头交代",text:"第1自然段交代了<b>时间</b>（1949年10月1日）、<b>地点</b>（首都北京）、<b>事件</b>（中央人民政府成立，举行典礼）和<b>参加的人</b>（总数达三十万人）。"},{tag:"句式批注",text:"“<b>有</b>……<b>有</b>……<b>有</b>……<b>还有</b>……”一路列举，写出参加典礼的人<b>数量多、范围广</b>，还没进会场，就已经感到典礼的盛大。——这正是课后第3题要你写的“批注”。"},{tag:"词语",text:"<b>开国大典</b>：“开国”指建立新的国家，“大典”指隆重盛大的典礼。<b>城防部队</b>：守卫城市的部队。<b>观礼台</b>：观看典礼的看台。"}]},{id:"p2a",act:"venue",clock:"会场布置",para:2,focus:["会场在天安门广场。广场呈丁字形。"],title:"先总说：广场是“丁”字形的",stage:{cam:"plan",tod:"morning",reveal:"ground",crowd:0},points:[{tag:"写法",text:"介绍会场，先用一句话<b>总说形状</b>——“丁字形”：一横在北，一竖向南，像汉字“丁”。再按方位一处一处分说。"},{tag:"看图",text:"俯视沙盘里金色描边的，就是1949年的丁字形广场。它和今天的天安门广场<b>不一样</b>：当年四周有红墙围着，面积也小得多。",ext:!0}]},{id:"p2b",act:"venue",clock:"会场布置",para:2,focus:["丁字形一横的北面是一道河，河上并排架着五座白石桥；"],title:"一横的北面：一道河，五座白石桥",stage:{cam:"bridges",tod:"morning",reveal:"river",crowd:0},points:[{tag:"方位词",text:"“<b>北面</b>”——以丁字形的“一横”为参照，往北看。"},{tag:"用词",text:"“<b>并排</b>架着”写出五座桥整齐排列；“<b>白</b>石桥”写出颜色。"},{tag:"课外",text:"这道河叫<b>外金水河</b>，河上的白石桥就是<b>金水桥</b>。",ext:!0}]},{id:"p2c",act:"venue",clock:"会场布置",para:2,focus:["再北面是城墙，城墙中央高高耸起天安门的城楼。"],title:"再北面：城墙，城楼高高耸起",stage:{cam:"gate3q",tod:"morning",reveal:"gate",crowd:0},points:[{tag:"方位词",text:"“<b>再北面</b>”——以河和白石桥为参照，继续往北推进。方位一步步移动，读者脑中的画面也一步步“搭”起来。"},{tag:"用词",text:"“<b>高高耸起</b>”写出城楼高大雄伟；“<b>中央</b>”点明城楼的位置。"}]},{id:"p2d",act:"venue",clock:"会场布置",para:2,focus:["丁字形的一竖向南直伸到中华门。"],title:"一竖向南：直伸到中华门",stage:{cam:"planLong",tod:"morning",reveal:"stem",crowd:0},points:[{tag:"用词",text:"“<b>直伸</b>”本是动作，用来写静止的广场，让画面有了延伸感，写出“一竖”又长又直。"},{tag:"课外",text:"中华门已于<b>1959年</b>拆除，原址大致就是今天毛主席纪念堂所在的位置。",ext:!0}]},{id:"p2e",act:"venue",clock:"会场布置",para:2,focus:["在一横一竖的交点的南面，场中挺立着一根电动旗杆。"],title:"互动：电动旗杆立在哪里？",stage:{cam:"planPole",tod:"morning",reveal:"stem",crowd:0},interact:"placePole",points:[{tag:"精确定位",text:"“一横一竖的<b>交点</b>的<b>南面</b>”——先找交点，再往南，一个短语就把位置说得清清楚楚。"},{tag:"用词",text:"“<b>挺立</b>”写出旗杆笔直、庄重，好像一位站岗的哨兵。"}]},{id:"p3",act:"venue",clock:"会场布置",para:3,focus:["主席台设在天安门城楼上。","城楼檐下，八盏大红宫灯分挂两边。","靠着城楼左右两边的石栏，八面红旗迎风招展。"],title:"主席台：八盏宫灯，八面红旗",stage:{cam:"gateClose",tod:"morning",reveal:"dress",crowd:0},interact:"lanterns",points:[{tag:"课后第3题 · 例句①",text:"批注示范：“<b>八盏</b>”“<b>八面</b>”数量多、左右对称，显得<b>隆重</b>；“<b>大红</b>”颜色鲜艳，“<b>迎风招展</b>”富有动感，显得<b>喜庆</b>。静中有动，庄严又热烈。"},{tag:"读音",text:"盏 <b>zhǎn</b>（上“戋”下“皿”）；石栏 <b>lán</b>（木字旁，别写成“拦”）。"}]},{id:"a1sum",act:"venue",clock:"会场布置",para:2,focus:["丁字形","北面","再北面","向南","交点的南面"],title:"小结：按方位顺序写会场",stage:{cam:"overview",tod:"morning",reveal:"dress",crowd:0},interact:"quizVenue",points:[{tag:"写法小结",text:"<b>先总后分</b>＋<b>方位顺序</b>：总说“丁字形” → 一横北面（河、桥） → 再北面（城墙、城楼） → 一竖向南（中华门） → 交点南面（旗杆） → 城楼上（主席台）。写校园、公园等地方时，可以学这种写法。"}]},{id:"p4a",act:"entry",clock:"早上六点钟起",para:4,focus:["丁字形的广场汇集了从四面八方来的群众队伍。","早上六点钟起，就有群众的队伍入场了。","人们有的擎着红旗，有的提着红灯。","进入会场后，按照预定的地点排列。"],title:"面：从四面八方汇集而来",stage:{cam:"morningWide",tod:"morning",reveal:"all",crowd:.35,flow:!0},lens:"面",points:[{tag:"读音词义",text:"<b>擎</b> qíng：举。“有的擎着红旗，有的提着红灯”——红色贯穿全文。"},{tag:"面",text:"“<b>四面八方</b>”写的是整体场面：来的人多、来的地方广；“<b>按照预定的地点排列</b>”——人虽多，却井然有序。"}]},{id:"p4b",act:"entry",clock:"清早 · 五更天",para:4,focus:["工人队伍中，有从老远的长辛店、丰台、通县来的铁路工人，他们清早到了北京车站，一下火车就直奔会场。","郊区的农民是五更天摸着黑起床，步行四五十里路赶来的。"],title:"点：铁路工人和郊区农民",stage:{cam:"streamFocus",tod:"morning",reveal:"all",crowd:.55,flow:!0,highlightStreams:!0},lens:"点",points:[{tag:"点面结合 · 初识",text:"先写“四面八方的群众队伍”（<b>面</b>），再特写<b>铁路工人</b>和<b>郊区农民</b>（<b>点</b>）。这就是本单元的语文要素——点面结合。"},{tag:"读音",text:"直奔 <b>bèn</b>（径直奔向）；五更 <b>gēng</b> 天（大约早晨四五点钟）。"},{tag:"体会心情",text:"“老远”“一下火车就直奔”“五更天摸着黑”“步行四五十里”——来得<b>远</b>、来得<b>早</b>、来得<b>急</b>，人们盼望新中国诞生的心情多么急切！"}]},{id:"p4c",act:"entry",clock:"到了正午",para:4,focus:["到了正午，天安门广场已经成了人的海洋，红旗翻动，像海上的波浪。"],title:"正午：人的海洋，红旗如浪",stage:{cam:"seaOfPeople",tod:"noon",reveal:"all",crowd:1,wave:!0},interact:"timeSlider",points:[{tag:"课后第3题 · 例句②",text:"两个<b>比喻</b>：把人群比作“<b>海洋</b>”，写出人多；把翻动的红旗比作“<b>海上的波浪</b>”，写出红旗多、动感强。广场上一片热烈、欢腾。"},{tag:"时间线索",text:"“早上六点钟起”→“到了正午”——课文按<b>时间顺序</b>推进。拖动时间条，看人潮怎样涌满广场。"}]},{id:"a2quiz",act:"entry",clock:"到了正午",para:4,focus:["四面八方","早上六点钟起","五更天摸着黑起床","步行四五十里路","人的海洋"],title:"想一想：“开国大典”大在哪里？",stage:{cam:"seaOfPeople",tod:"noon",reveal:"all",crowd:1,wave:!0},interact:"quizBig",points:[{tag:"归纳",text:"人数多（三十万人、人的海洋），范围广（四面八方），来得早（六点钟起、五更天），路途远（四五十里）——“大”字处处有依据。"}]},{id:"p5",act:"ceremony",clock:"下午三点整",para:5,focus:["下午三点整，会场上爆发出一阵排山倒海的掌声","三十万人的目光一齐投向主席台。"],title:"三点整：三十万道目光",stage:{cam:"crowdPOV",tod:"afternoon",reveal:"all",crowd:1,applause:1},points:[{tag:"词语",text:"<b>排山倒海</b>：推倒高山，翻倒大海，形容力量强、声势大。<b>爆发</b>：突然发出。"},{tag:"侧面描写",text:"课文没有直接描写毛主席的样子，而是写<b>群众的反应</b>——“排山倒海的掌声”“目光一齐投向”，表现人民对领袖的爱戴。"}]},{id:"p6",act:"ceremony",clock:"下午三点整",para:6,focus:["林伯渠宣布典礼开始","就位","乐队奏起了中华人民共和国国歌——《义勇军进行曲》。","正是这战斗的声音，曾经鼓舞中国人民为新中国的诞生而奋斗。","“中华人民共和国中央人民政府今天成立了！”"],title:"庄严宣告",stage:{cam:"gateHero",tod:"afternoon",reveal:"all",crowd:1},interact:"declare",points:[{tag:"典礼程序",text:"宣布典礼开始 → 主席、副主席、委员就位 → 奏国歌 → <b>宣告中央人民政府成立</b>。"},{tag:"读音",text:"秘书<b>长</b> zhǎng ／ <b>长</b>辛店 cháng；<b>曾</b>经 céng；<b>为</b>新中国的诞生而奋斗 wèi。"},{tag:"课外",text:"1949年9月27日，全国政协第一届全体会议决定：在国歌未正式制定前，以《义勇军进行曲》为国歌。",ext:!0}]},{id:"p7",act:"ceremony",clock:"下午三点",para:7,focus:["这庄严的宣告，这雄伟的声音","使全场三十万人一齐欢呼起来","经过无线电的广播，传到长城内外，传到大江南北","使全中国人民的心一齐欢跃起来"],title:"声音传遍长城内外、大江南北",stage:{cam:"broadcast",tod:"afternoon",reveal:"all",crowd:1,broadcast:!0,applause:1},points:[{tag:"反复",text:"“<b>这庄严的宣告，这雄伟的声音</b>”连说两遍，强调这一宣告的分量，抒发激动、自豪之情。"},{tag:"由点到面",text:"范围从“<b>全场三十万人</b>”扩大到“<b>长城内外、大江南北</b>”（全国）；从“欢呼”（声音）写到“心一齐<b>欢跃</b>”（内心）。"}]},{id:"p8",act:"ceremony",clock:"升旗",para:8,focus:["毛主席亲自按动连通电动旗杆的电钮，新中国的国旗——五星红旗徐徐上升。","三十万人一齐脱帽肃立，一齐抬起头，瞻仰这鲜红的国旗。","五星红旗升起来了，表明中国人民从此站起来了。"],title:"互动：按下电钮，升起五星红旗",stage:{cam:"flagRise",tod:"afternoon",reveal:"all",crowd:1},interact:"raiseFlag",points:[{tag:"动作",text:"“一齐脱帽肃立，一齐抬起头，瞻仰”——两个“<b>一齐</b>”写出三十万人动作整齐、心情一致；<b>瞻仰</b>（zhān yǎng）是恭敬地看，饱含崇敬。"},{tag:"句子含义",text:"“五星红旗升起来了，表明中国人民从此站起来了”：国旗升起，象征新中国诞生，中国人民从此成为国家的主人，不再受压迫。"},{tag:"辨一辨",text:"“徐徐上升”的“徐徐”是慢慢地——国旗升得庄重、从容。"}]},{id:"p9",act:"ceremony",clock:"升旗 · 礼炮",para:9,focus:["每一响都是五十四门大炮齐发，一共二十八响。","起初是全场肃静，只听见炮声，只听见国旗和许多旗帜飘拂的声音","到后来，每声炮响后，全场就响起一阵雷鸣般的掌声。"],title:"二十八响礼炮：从肃静到雷鸣",stage:{cam:"salute",tod:"afternoon",reveal:"all",crowd:1,flagUp:!0},interact:"salute",points:[{tag:"以声写静",text:"“<b>只听见</b>炮声，<b>只听见</b>……飘拂的声音”——连旗帜飘动都听得见，可见全场多么<b>肃静</b>、庄严。"},{tag:"前后对比",text:"起初“全场肃静” → 到后来“<b>雷鸣般的掌声</b>”：气氛由<b>庄严</b>转向<b>热烈</b>。开启声音，你会听到这个变化。"},{tag:"课外",text:"<b>54</b>门礼炮代表参加新政协的54个单位和方面；<b>28</b>响象征中国共产党从1921年成立到1949年建国的28年。礼炮每响间隔约4.5秒，2分05秒内打完28响——国旗升到顶，礼炮恰好鸣完。",ext:!0}]},{id:"p10",act:"ceremony",clock:"宣读公告",para:10,focus:["他用强有力的语调向全世界发出新中国的声音。","他读到“选举了毛泽东为中央人民政府主席”这一句的时候，广场上的人们热爱领袖的心情融成一阵热烈的欢呼。","观礼台上同时响起一阵掌声。"],title:"宣读公告：向全世界发出新中国的声音",stage:{cam:"gateHero",tod:"afternoon",reveal:"all",crowd:1,flagUp:!0,applause:1},points:[{tag:"读音",text:"语<b>调</b> diào；选举毛泽东<b>为</b>主席 wéi（与上文“为新中国的诞生而奋斗”的 wèi 区分）。"},{tag:"场内呼应",text:"广场上“一阵热烈的<b>欢呼</b>”，观礼台上“同时响起一阵<b>掌声</b>”——处处都是激动的人们。"}]},{id:"a3quiz",act:"ceremony",clock:"典礼",para:6,focus:["宣布典礼开始"],title:"排一排：典礼的顺序",stage:{cam:"gateHero",tod:"afternoon",reveal:"all",crowd:1,flagUp:!0},interact:"quizOrder",points:[{tag:"典礼三件大事",text:"<b>宣告成立</b> → <b>升国旗</b>（鸣礼炮） → <b>宣读公告</b>。按顺序说清楚，就是课后第1题的一部分。"}]},{id:"p11",act:"parade",clock:"阅兵式开始",para:11,focus:["朱德总司令任检阅司令员，聂荣臻将军任阅兵总指挥。","朱总司令和聂将军同乘汽车，先检阅部队，然后朱总司令回到主席台，宣读中国人民解放军总部的命令。","由东往西，缓缓进场。"],title:"阅兵开始：由东往西，缓缓进场",stage:{cam:"paradeWide",tod:"afternoon",reveal:"all",crowd:1,flagUp:!0,parade:"start"},points:[{tag:"阅兵程序",text:"乘车<b>检阅部队</b> → 回主席台<b>宣读命令</b> → 部队<b>由东往西</b>，<b>缓缓</b>进场。"},{tag:"读音",text:"聂荣臻 <b>Niè Róngzhēn</b>；检阅 jiǎn <b>yuè</b>。"}]},{id:"p12",act:"parade",clock:"阅兵",para:12,focus:["开头是海军两个排","接着是步兵一个师","接着是炮兵一个师","接着是一个战车师","接着是一个骑兵师"],title:"互动：逐个“特写”受阅部队",stage:{cam:"paradeWide",tod:"afternoon",reveal:"all",crowd:1,flagUp:!0,parade:"run"},interact:"units",lens:"点",points:[{tag:"顺序",text:"“<b>开头是</b>……<b>接着是</b>……<b>接着是</b>……”按出场顺序串起五支部队，条理清楚。"},{tag:"抓特点",text:"每支部队只抓<b>最突出的特点</b>：海军看颜色，步兵看队形，炮兵看装备，战车用比喻，骑兵看颜色和动作。点下方按钮逐个看。"}]},{id:"p12b",act:"parade",clock:"阅兵",para:12,focus:["以上这些部队，全都以相等的距离和相同的速度经过主席台前。","当战车部队经过的时候，人民空军的飞机也一队队排成人字形，飞过天空。","毛主席首先向空中招手。","群众看见了，都把头上的帽子、手里的报纸和别的东西抛上天去，欢呼声盖过了飞机的隆隆声。"],title:"面：相等的距离，相同的速度",stage:{cam:"paradeHigh",tod:"afternoon",reveal:"all",crowd:1,flagUp:!0,parade:"run",spacing:!0,planes:!0,toss:!0},lens:"面",points:[{tag:"面",text:"“以上这些部队，<b>全都</b>以<b>相等的距离</b>和<b>相同的速度</b>经过主席台前”——概括写全体部队，写出整齐划一、纪律严明。画面里的标尺告诉你：间距真的一样。"},{tag:"点与面",text:"“毛主席<b>首先</b>向空中招手”是<b>点</b>；“群众……都把帽子、报纸……抛上天去”是<b>面</b>。"},{tag:"衬托",text:"“欢呼声<b>盖过了</b>飞机的隆隆声”——用飞机声衬托欢呼声之大，群众激动到了极点。"}]},{id:"p13",act:"parade",clock:"两个半钟头",para:13,focus:["不断地欢呼，不断地鼓掌，一个高潮接着一个高潮。","群众差不多把嗓子都喊哑了，把手掌都拍麻了，还觉得不能够表达自己心里的欢喜和激动。"],title:"两个半钟头：一个高潮接着一个高潮",stage:{cam:"paradeHigh",tod:"lateAfternoon",reveal:"all",crowd:1,flagUp:!0,parade:"run",applause:1},interact:"waves",points:[{tag:"课后第3题 · 例句③",text:"两个“<b>不断地</b>”写出欢呼、鼓掌一直没停；“<b>一个高潮接着一个高潮</b>”写出热烈的气氛层层推进。"},{tag:"细节",text:"“嗓子都<b>喊哑</b>了”“手掌都<b>拍麻</b>了”，还“觉得不能够表达”——用具体细节写出人们的欢喜和激动已经到了极点。"}]},{id:"a4lab",act:"parade",clock:"阅兵",para:12,focus:["以上这些部队"],title:"点面结合实验室",stage:{cam:"paradeWide",tod:"lateAfternoon",reveal:"all",crowd:1,flagUp:!0,parade:"run"},interact:"labPointFace",points:[{tag:"本单元语文要素",text:"<b>面</b>：对整个场面的概括描写；<b>点</b>：对场面中有代表性的人或事物的具体描写。<b>点面结合</b>，既写出场面的<b>整体气势</b>，又突出<b>细节特点</b>——既见“森林”，又见“树木”。"}]},{id:"p14a",act:"march",clock:"傍晚",para:14,focus:["天安门广场上的灯笼火把全都点起来，一万支礼花陆续射入天空。","天上五颜六色的火花结成彩，地上千千万万的灯火一片红。"],title:"互动：点亮礼花（轻点天空）",stage:{cam:"nightSky",tod:"dusk",reveal:"all",crowd:1,flagUp:!0,lanterns:!0,fireworks:!0},interact:"fireworks",points:[{tag:"对偶",text:"“<b>天上</b>五颜六色的火花结成彩，<b>地上</b>千千万万的灯火一片红”——上下对照，天地辉映，色彩绚丽，节日气氛浓烈。"},{tag:"词语",text:"<b>陆续</b>：先先后后，断断续续。一万支礼花不是同时，而是一支接一支射上天空。"}]},{id:"p14b",act:"march",clock:"傍晚 · 游行",para:14,focus:["游行队伍分东西两个方向出发","走过正对天安门的白石桥前，就举起灯笼火把，高声欢呼","毛主席在城楼上主席台前边，向前探着身子，不断地向群众挥手，不断地高呼“人民万岁！”“同志们万岁！”"],title:"游行：群众与领袖的呼应",stage:{cam:"marchPass",tod:"night",reveal:"all",crowd:1,flagUp:!0,lanterns:!0,march:!0},interact:"callResponse",points:[{tag:"面",text:"游行队伍<b>分东西两个方向出发</b>，擎着灯、舞着火把、高呼口号——写整体场面。"},{tag:"点 · 动作描写",text:"“向前<b>探着</b>身子，<b>不断地</b>向群众<b>挥手</b>，<b>不断地高呼</b>”——特写城楼上的毛主席，领袖与人民心连心。"}]},{id:"p15",act:"march",clock:"晚上九点半",para:15,focus:["晚上九点半，游行队伍才完全走出会场。","两股“红流”分头向东城、西城的街道流去，光明充满了整个北京城。"],title:"九点半：光明充满了整个北京城",stage:{cam:"cityNight",tod:"night",reveal:"all",crowd:0,flagUp:!0,lanterns:!0,redFlow:!0,cityLights:!0},points:[{tag:"一个“才”字",text:"从“早上六点钟起”到“晚上九点半<b>才</b>”完全走出会场——活动时间长，人们热情高涨、久久不愿离去。"},{tag:"“红流”",text:"加引号表示<b>特殊含义</b>：擎着红灯、举着火把的游行队伍，像两股红色的河流。"},{tag:"“光明”",text:"既指灯火照亮了北京城，也<b>象征</b>新中国成立，前途一片光明。"}]},{id:"a5sum",act:"march",clock:"全天回顾",para:1,focus:["1949年10月1日"],title:"回顾：四个场面，按时间顺序",stage:{cam:"overviewNight",tod:"night",reveal:"all",crowd:0,flagUp:!0,lanterns:!0,cityLights:!0,redFlow:!0},interact:"structure",points:[{tag:"课后第1题",text:"从群众入场到游行结束，课文写了四个场面：<b>群众入场</b> → <b>开国典礼</b> → <b>阅兵式</b> → <b>群众游行</b>。"},{tag:"有详有略",text:"下方的条形图按<b>课文实际字数</b>统计：开国典礼和阅兵式写得最详细——它们是这一天最重要的部分。"}]}],hh={q:"“再北面是城墙”中的“再北面”，是以什么为参照说的？",options:["天安门城楼","一道河和河上的白石桥","中华门","电动旗杆"],answer:1,explain:"前一句写“一横的北面是一道河……五座白石桥”，“再北面”就是在河的基础上继续往北。"},or={q:"从第1～4自然段中，找出开国大典“大”的依据（多选）",options:[{t:"人数多：总数达三十万人，成了“人的海洋”",ok:!0},{t:"范围广：从四面八方来",ok:!0},{t:"来得早：早上六点钟起、五更天摸着黑起床",ok:!0},{t:"路途远：步行四五十里路赶来",ok:!0},{t:"天气好：那天阳光明媚、万里无云",ok:!1}],explain:"课文并没有写天气——答题要从原文找依据，不能凭想象添加。"},Oo={q:"按课文顺序，依次点击典礼的五个环节",items:["宣布典礼开始","奏国歌《义勇军进行曲》","宣告中央人民政府成立","升国旗，鸣礼炮","宣读中央人民政府公告"]},zo=[{t:"受检阅的部队就由聂将军率领……由东往西，缓缓进场。",a:"面"},{t:"开头是海军两个排，雪白的帽子，跟海洋一个颜色的蓝制服。",a:"点"},{t:"接着是一个骑兵师，“红马连”一色红马，“白马连”一色白马，五马并行……",a:"点"},{t:"以上这些部队，全都以相等的距离和相同的速度经过主席台前。",a:"面"},{t:"毛主席首先向空中招手。",a:"点"},{t:"群众看见了，都把头上的帽子、手里的报纸和别的东西抛上天去……",a:"面"}],ys=[{id:"navy",name:"海军",scale:"两个排",key:"颜色",quote:"开头是海军两个排，雪白的帽子，跟海洋一个颜色的蓝制服。",note:"抓<b>颜色</b>：雪白的帽子＋海洋一样的蓝制服，一看就是海军。"},{id:"infantry",name:"步兵",scale:"一个师",key:"队形",quote:"接着是步兵一个师，以连为单位，列成方阵，齐步行进。",note:"抓<b>队形</b>：以连为单位，列成方阵，齐步行进——整齐有力。"},{id:"artillery",name:"炮兵",scale:"一个师",key:"装备",quote:"接着是炮兵一个师，野炮、山炮、榴弹炮、火箭炮，各式各样的炮，都排成一字形的横列前进。",note:"抓<b>装备</b>：列举四种炮，写出种类多；“一字形的横列”写出排列整齐。"},{id:"tanks",name:"战车",scale:"一个师",key:"比喻",quote:"接着是一个战车师，各种装甲车和坦克车两辆或三辆一排，整整齐齐地前进；战士们挺着胸膛站在战车上，像钢铁巨人一样。",note:"<b>比喻</b>：战士们“像钢铁巨人一样”，写出威武雄壮。"},{id:"cavalry",name:"骑兵",scale:"一个师",key:"颜色＋动作",quote:"接着是一个骑兵师，“红马连”一色红马，“白马连”一色白马，五马并行，马腿的动作完全一致。",note:"抓<b>颜色</b>（一色红马、一色白马）和<b>动作</b>（马腿的动作完全一致）。"},{id:"air",name:"空军",scale:"一队队",key:"队形",quote:"当战车部队经过的时候，人民空军的飞机也一队队排成人字形，飞过天空。",note:"抓<b>队形</b>：排成“人字形”；出现的时机是“当战车部队经过的时候”。"}],bn={homework:[{q:"课后第1题：默读课文，体会新中国成立时人们自豪、激动的心情。想想从群众入场到游行结束，课文写了哪几个场面，连起来简要说说开国大典的过程。",a:"<b>四个场面</b>：群众入场 → 开国典礼 → 阅兵式 → 群众游行。<br><b>参考说法</b>：1949年10月1日，首都北京举行开国大典。早上六点钟起，群众队伍从四面八方入场。下午三点整，典礼开始，奏国歌后，毛泽东主席宣告中央人民政府成立，接着升国旗、鸣礼炮，宣读中央人民政府公告。随后举行阅兵式，海军、步兵、炮兵、战车、骑兵依次受阅，空军飞过天空。傍晚，群众提灯游行，到晚上九点半才完全走出会场。"},{q:"课后第2题：读读写阅兵式的部分，说说课文是怎样描写这个场面的。",a:"① <b>按顺序</b>：先写检阅部队、宣读命令，再按“开头是……接着是……”写各部队依次受阅，最后写群众的反应。<br>② <b>点面结合</b>：既概括写全部部队“以相等的距离和相同的速度经过主席台前”（面），又具体写海军、步兵、炮兵、战车、骑兵、空军各自的特点（点）。<br>③ <b>抓特点</b>：颜色、队形、装备、比喻、动作，各不相同。<br>④ <b>正侧结合</b>：写部队的同时写群众抛帽欢呼，衬托阅兵的壮观。"},{q:"课后第3题：读句子，体会字里行间传达出的热烈、庄严的气氛，再找出这样的句子作批注。",a:"批注三步法：<b>圈关键词</b>（如“八盏”“迎风招展”“人的海洋”“不断地”）→ <b>说写法</b>（数量词、比喻、反复、细节……）→ <b>谈感受</b>（庄严、隆重、热烈、激动）。<br>还可以批注：“有……有……还有……”（人多范围广）、“这庄严的宣告，这雄伟的声音”（反复，激动自豪）、“只听见炮声……”（以声写静，庄严肃穆）。"}],polyphones:[{ch:"长",a:"秘书长 zhǎng",b:"长辛店、长城 cháng"},{ch:"为",a:"为新中国的诞生而奋斗 wèi",b:"选举毛泽东为主席 wéi"},{ch:"奔",a:"直奔会场 bèn",b:"奔跑 bēn"},{ch:"都",a:"首都北京 dū",b:"都把帽子抛上天 dōu"},{ch:"调",a:"语调 diào",b:"调皮 tiáo"},{ch:"差",a:"差不多 chà",b:"差别 chā"}],readings:["擎 qíng","瞻仰 zhān yǎng","五更 gēng 天","肃立 sù lì","聂荣臻 Niè Róngzhēn","榴 liú 弹炮","飘拂 fú","胸膛 táng","陆续 lù xù","盏 zhǎn"],chars:[{c:"盏",tip:"上“戋”下“皿”，量词：八盏宫灯"},{c:"帜",tip:"巾字旁：旗帜（不是“织”）"},{c:"栏",tip:"木字旁：石栏（“拦”是提手旁）"},{c:"距",tip:"足字旁：距离（“拒”是提手旁）"},{c:"爆",tip:"火字旁：爆发"},{c:"隆",tip:"右下“生”上面有一短横：隆隆"},{c:"宣",tip:"宝盖头＋亘：宣布、宣告、宣读"},{c:"阅",tip:"门字框里是“兑”：检阅"},{c:"坦",tip:"土字旁：坦克"},{c:"汇",tip:"三点水：汇集"}],words:[["汇集","聚集到一起"],["擎","举"],["五更天","大约早晨四五点钟"],["排山倒海","形容力量强，声势大"],["就位","到自己应到的位置上"],["肃立","恭敬、庄严地站着"],["瞻仰","恭敬地看"],["肃静","严肃寂静"],["陆续","先先后后，断断续续"],["缓缓","慢慢地"],["检阅","高级首长亲临军队面前举行检验仪式"]],pairs:{near:["汇集—聚集","宣告—宣布","挺立—屹立","欢跃—欢腾","排山倒海—惊天动地"],anti:["汇集—分散","肃静—喧哗","完毕—开始","缓缓—匆匆","整整齐齐—乱七八糟"]},sentences:[{s:"到了正午，天安门广场已经成了人的海洋，红旗翻动，像海上的波浪。",k:"比喻",a:"把人群比作海洋、把红旗翻动比作波浪，写出人多、旗多、场面热烈。"},{s:"这庄严的宣告，这雄伟的声音，经过无线电的广播，传到长城内外，传到大江南北，使全中国人民的心一齐欢跃起来。",k:"反复·排比",a:"强调宣告的伟大意义；范围由会场扩大到全国，抒发全国人民的激动和自豪。"},{s:"三十万人一齐脱帽肃立，一齐抬起头，瞻仰这鲜红的国旗。",k:"动作描写",a:"两个“一齐”写出动作整齐、心情一致，“瞻仰”表达对国旗的崇敬。"},{s:"起初是全场肃静，只听见炮声，只听见国旗和许多旗帜飘拂的声音，到后来，每声炮响后，全场就响起一阵雷鸣般的掌声。",k:"以声写静·对比",a:"先用细微的声音衬托全场肃静、庄严，再用“雷鸣般的掌声”写气氛转为热烈。"},{s:"战士们挺着胸膛站在战车上，像钢铁巨人一样。",k:"比喻",a:"写出战士们威武雄壮、坚强有力，表达对人民军队的赞美和自豪。"},{s:"群众差不多把嗓子都喊哑了，把手掌都拍麻了，还觉得不能够表达自己心里的欢喜和激动。",k:"细节",a:"“喊哑”“拍麻”的细节写出群众激动到了极点，感情之深难以表达。"},{s:"天上五颜六色的火花结成彩，地上千千万万的灯火一片红。",k:"对偶",a:"天上地下交相辉映，色彩绚丽，渲染出欢庆的节日气氛。"},{s:"两股“红流”分头向东城、西城的街道流去，光明充满了整个北京城。",k:"比喻·象征",a:"“红流”比喻提灯游行的队伍；“光明”既写灯火，又象征新中国光明的前途。"}],writing:{title:"习作迁移：用点面结合写一次活动（对应本单元习作《多彩的活动》）",steps:["先写“面”：交代时间、地点，概括写整个场面（人多不多？气氛怎样？）","再写“点”：挑一两个有代表性的人，写他的动作、神态、语言","回到“面”：写全场的反应，把气氛推向高潮","写出自己的感受"],sample:"下午，拔河比赛在操场上打响了。操场四周围满了同学，加油声一浪高过一浪。<b>（面）</b>我们班的“大力士”小林站在队伍最后，他把绳子在腰上绕了一圈，身子向后仰，脚跟死死地抵住地面，脸憋得通红。<b>（点）</b>“一、二！一、二！”全班同学跟着口令一齐发力，红绸一点一点向我们这边移过来……哨声响起，场边一下子沸腾了，大家跳着、叫着，把帽子都抛上了天。<b>（面）</b>那一刻，我觉得嗓子喊哑了也值得！"},facts:[{t:"“中国人民从此站起来了”是在城楼上说的吗？",a:"课文里这句话是作者的叙述。毛泽东“占人类总数四分之一的中国人从此站立起来了”这句话，出自<b>1949年9月21日</b>全国政协第一届全体会议的开幕词，不是在开国大典城楼上说的。"},{t:"10月1日为什么是国庆节？",a:"1949年12月2日，中央人民政府委员会通过决议：每年10月1日，即中华人民共和国宣告成立的伟大日子，为国庆日。"},{t:"54门礼炮、28响有什么寓意？",a:"54门代表参加新政协的54个单位和方面；28响象征中国共产党从1921年成立到1949年建国的28年。礼炮每响间隔约4.5秒，2分05秒内鸣放完毕。"},{t:"课文里的中华门还在吗？",a:"中华门已于1959年拆除，原址大致在今天毛主席纪念堂的位置。1949年的广场是四周围着红墙的“丁”字形，比今天小得多。"},{t:"“国歌”那时已经确定了吗？",a:"1949年9月27日，全国政协第一届全体会议决定：在国歌未正式制定前，以《义勇军进行曲》为国歌。"}]},Bo=[{q:"开国大典在哪一天举行？",o:["1949年9月21日","1949年10月1日","1949年12月2日"],a:1},{q
